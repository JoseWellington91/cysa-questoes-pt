<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>CySA+ Questões — Treino em Português</title>
    <script>
      // GitHub Pages SPA redirect: keeps the repo subpath in the URL
      var repoName = "cysa-questoes-pt";
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") + "/" + repoName + "/"
      );
    </script>
  </head>
  <body>
    <p>Redirecionando...</p>
  </body>
</html>
