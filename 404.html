<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>CySA+ Questões — Treino em Português</title>
    <script>
      // GitHub Pages SPA redirect: converts path to hash-based routing
      var pathSegmentsToKeep = 0; // Adjust if repo is under a subpath
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        (l.hash ? "~and~" + l.hash.slice(1) : "")
      );
    </script>
  </head>
  <body>
    <p>Redirecionando...</p>
  </body>
</html>
